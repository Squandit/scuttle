# Scuttle configuration.
#
# Copy this to ~/.config/scuttle/config.toml and change what you like.
# Every setting is optional: anything you leave out keeps the value shown
# here. Scuttle reloads the file as soon as you save it.

[appearance]
# Built-in themes: "ferris", "tide", "dune", "bone". Or "wallpaper" to
# take the colours from your wallpaper palette, so Scuttle matches
# everything else matugen themes. It updates when the wallpaper changes.
theme = "ferris"
# The palette file read by the "wallpaper" theme. Leave it out to use
# matugen's usual output. Any file of "@define-color name #hex;" lines
# with Material role names (primary, surface, on_surface) works.
# palette_file = "/home/you/.config/matugen/generated/colors.css"
# "dark" or "light".
mode = "dark"
# Override the theme's accent colour, e.g. accent = "#3355ff".
# Text colours on top of it are picked automatically to stay readable.
# accent = "#f74c00"
# Size of everything Scuttle draws: text, the bar, the launcher and the
# spacing between things. 1.0 is the base design size. Raise it if things
# look small on your screen, 0.75 to 2.5. Other pixel sizes in this file
# (bar height, margin, radius) are base sizes and are multiplied by this.
scale = 1.25
# Corner radius of panels in pixels, 0 to 32.
radius = 18
# Blur what is behind translucent panels. Needs the Hyprland layer rules
# from the README.
blur = true
# How much the shell animates: "off", "subtle" or "full".
motion = "subtle"
# Fonts. If one is not installed, a common fallback is used.
font = "Geist"
font_display = "Sora"
font_mono = "Geist Mono"

[bar]
# "top", "bottom", or "none" for no bar at all. Without a bar, the clock,
# battery and workspaces show in the corners of the launcher instead.
position = "top"
# "strip" is one full-width bar, "islands" is three floating pills,
# "notch" is a small tab holding workspaces, clock and battery.
style = "strip"
# Height in pixels, 24 to 72.
height = 40
# Gap between the bar and the screen edge in pixels, 0 to 64.
margin = 10
# Which modules go where. Available: "workspaces", "title", "clock",
# "media", "cpu", "memory", "network", "volume", "battery",
# "notifications". The battery module only appears on machines that have
# a battery. "notifications" is a badge that appears when you have
# unread notifications or "do not disturb" is on. "volume" shows the
# output level: scroll on it to change it, click to mute. "media" shows
# what is playing in any player that supports MPRIS (most do): click to
# play or pause, scroll to skip. It hides when no player is running.
left = ["workspaces", "title"]
center = ["clock"]
right = ["media", "cpu", "memory", "network", "volume", "battery", "notifications"]
# strftime format. Add %S to show seconds.
clock_format = "%a %d %b   %H:%M"
# How many numbered workspaces are always shown, 1 to 20.
workspaces = 4

[launcher]
# Where web searches go. {query} is replaced with what you typed.
web_search = "https://duckduckgo.com/?q={query}"
# Most results shown at once, 1 to 50.
max_results = 8
# Terminal for apps that need one. Empty means: use $TERMINAL, or the
# first of kitty, foot, ghostty, alacritty, wezterm that is installed.
terminal = ""
# Folders searched for files. Relative paths start at your home folder.
file_roots = ["Documents", "Downloads", "Pictures", "Desktop", "Projects"]

[notifications]
# Let Scuttle show notifications. Set this to false to keep using mako,
# dunst or another notification daemon. Takes effect on restart.
enabled = true
# Which corner they appear in: "top-right", "top-left", "bottom-right"
# or "bottom-left".
position = "top-right"
# How long a notification stays when the app does not say, in
# milliseconds, 1000 to 60000. Critical ones stay until dismissed.
timeout_ms = 5000
# Most notifications on screen at once, 1 to 10. Older ones make room
# and stay in the history.
max_visible = 4

[sound]
# Short, soft sounds when you open the launcher, move through results
# and run one. They are generated by Scuttle, not played from files.
# When they play: "never", "headphones" or "always". "headphones" means
# only while the audio output is headphones or a headset, wired or
# Bluetooth. Detecting that needs the pactl command (package libpulse).
feedback = "headphones"
# Loudness of interface sounds, 0.0 to 1.0.
volume = 0.25

[assistant]
# A side panel for asking Claude things and having it act on the
# desktop. Open it with `scuttle toggle assistant`. It can change
# volume, brightness, playback and do not disturb straight away, and it
# can propose terminal commands, which only ever run after you press
# Run. Set this to false to turn it off.
enabled = true
# How it reaches Claude:
#   "auto"          your Claude subscription through the `claude` command
#                   (Claude Code). When the subscription reaches its
#                   limit, your API key takes over until it resets.
#   "subscription"  only the subscription
#   "api"           only the API key
# The API key lives in the system keyring, never in this file. Set it
# with `scuttle assistant set-key`.
backend = "auto"
# The model used on each. The subscription has room for the strongest
# model; the API key is billed per use, so it gets the quick one.
subscription_model = "claude-opus-5-5"
api_model = "claude-haiku-5-5"
# Which side of the screen the panel opens on: "right" or "left".
side = "right"
# Width of the panel in pixels, 320 to 900, before appearance.scale.
width = 440

[power]
# On a laptop running on battery: turn blur off, and cap motion at
# "subtle". Neither applies to a desktop PC.
battery_disables_blur = true
battery_limits_motion = true
