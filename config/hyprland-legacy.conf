# Scuttle setup for Hyprland before 0.55 (hyprland.conf).
# Add this to ~/.config/hypr/hyprland.conf.
#
# Hyprland's rule syntax has changed between releases. If a line below
# is rejected, check the wiki page for your version.

# Start Scuttle with the session.
exec-once = scuttle

# Tap Super on its own to open the launcher.
bindr = SUPER, Super_L, exec, scuttle toggle launcher

# Volume and brightness keys. "e" repeats while held, "l" works on the
# lock screen.
bindel = , XF86AudioRaiseVolume, exec, scuttle volume up
bindel = , XF86AudioLowerVolume, exec, scuttle volume down
bindl = , XF86AudioMute, exec, scuttle volume mute
bindel = , XF86MonBrightnessUp, exec, scuttle brightness up
bindel = , XF86MonBrightnessDown, exec, scuttle brightness down

# Blur what is behind Scuttle's translucent panels.
layerrule = blur, scuttle-bar
layerrule = ignorealpha 0.3, scuttle-bar
layerrule = blur, scuttle-launcher
layerrule = ignorealpha 0.3, scuttle-launcher
layerrule = blur, scuttle-toasts
layerrule = ignorealpha 0.3, scuttle-toasts
layerrule = blur, scuttle-osd
layerrule = ignorealpha 0.3, scuttle-osd
